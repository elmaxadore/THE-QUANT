# config/templates/blue_guardian_instant_5k.yaml
firm_name: "Blue Guardian"
variant: "Instant 5K"
account_type: PropFirm
stage: Funded

initial_balance: 5000.00

rules:
  max_drawdown_pct: 10.0              # $500 max DD
  daily_loss_limit_pct: 0.0           # no separate daily limit
  profit_target_pct: 0.0              # instant — no profit target
  time_limit_days: 0                  # unlimited
  min_trading_days: 0
  leverage: 100
  allowed_instruments: [FOREX, METALS, INDICES, CRYPTO]
  news_trading: allowed
  weekend_hold: true
  consistency_rule: true
  anti_scalping: false                # no 2-min rule on instant

consistency_profile:
  profit_concentration:
    enabled: true
    threshold_pct: 15.0               # no single day > 15% of total profit
    lookback_days: 30
    enforcement_mode: Hard
    auto_adjust_sizing: true
  lot_size_consistency:
    enabled: true
    max_cv: 0.40                      # coefficient of variation
    enforcement_mode: Soft
  trade_frequency:
    enabled: false                    # no minimum frequency on instant

guardian_shield:
  enabled: true
  max_loss_per_trade: 50.00           # USD
  strike_limit: 2
  cooldown_bars: 0                    # no cooldown, just strikes
  auto_reduce_size_after_strike: true
  reduction_factor: 0.5

payout_cap:
  enabled: true
  total_cap: 250.00                   # lifetime max payout
  min_days_before_first_payout: 0     # instant — immediate
  payout_schedule: OnDemand
  payout_fee_pct: 0.0

scaling_rules:
  enabled: true
  scale_up_at_profit: 500.00          # +10% profit → scale to 10K
  new_balance_after_scale: 10000.00
  new_payout_cap_after_scale: 500.00  # cap increases
  max_scale_iterations: 4             # 5K → 10K → 20K → 40K → 80K
