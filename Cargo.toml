[package]
name = "the-quant"
version = "4.0.0"
edition = "2021"
rust-version = "1.78"
description = "The Quant — hybrid, self-scaling, self-updating autonomous quantitative trading system"
license = "Proprietary"

# ------------------------------------------------------------------
# The Quant is a HYBRID system:
#   * Rust  -> production core engine (data, features, risk, execution,
#              strategy routing, state, auto-update). Memory-safe, zero-cost,
#              low-latency-variance.
#   * Python-> OFFLINE model training only (GBDT/MLP/PPO). Trains in the
#              evolution lab, exports .onnx, never in the live hot path.
#   * ONNX  -> the bridge. Rust loads .onnx via the `ort` crate (sub-2ms
#              inference). This crate is behind the `ml` feature so a lean
#              Tier-1 build can compile and run without it.
#
# RESOURCE SCALING ("one binary, many machines"):
#   The binary detects RAM/CPU at boot and picks a Tier (1..4). Heavy
#   capabilities (RL, web, DB, TUI) are cargo *features* so that a lean
#   Tier-1 build does not even link them. Default features = lean.
# ------------------------------------------------------------------

[features]
default = ["crypto"]
# Core security (Argon2id vault + AES-256-GCM). Included by default; it is
# lightweight, pure-Rust, and needed by the state/security layer.
crypto = ["dep:argon2", "dep:aes-gcm", "dep:rand", "dep:sha2", "dep:subtle", "dep:rpassword"]
# Hybrid ML bridge: ONNX Runtime via `ort`. Pulls large C++-linked deps.
ml = ["dep:ort"]
# ratatui interactive dashboard (default build uses a plain ANSI dashboard).
tui = ["dep:crossterm", "dep:ratatui"]
# Local web dashboard (Axum + tokio). Enables HTTP server + SSE.
web = ["dep:axum", "dep:tokio", "dep:tower", "dep:serde_urlencoded"]
# PostgreSQL / TimescaleDB persistence. Falls back to in-memory/file store.
db = ["dep:sqlx"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# --- feature-gated ---
argon2 = { version = "0.5", optional = true }
aes-gcm = { version = "0.10", optional = true }
rand = { version = "0.8", optional = true }
sha2 = { version = "0.10", optional = true }
subtle = { version = "2", optional = true }
rpassword = { version = "7", optional = true }

ort = { version = "2.0.0-rc.13", optional = true, features = ["load-dynamic"] }
crossterm = { version = "0.27", optional = true }
ratatui = { version = "0.26", optional = true }
axum = { version = "0.7", optional = true }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
tower = { version = "0.4", optional = true, features = ["util", "timeout"] }
serde_urlencoded = { version = "0.7", optional = true }
sqlx = { version = "0.7", optional = true, features = ["runtime-tokio", "postgres", "time"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"

[profile.dev]
opt-level = 1
